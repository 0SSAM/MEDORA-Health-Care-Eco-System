name: Build MEDORA Windows 10 CMD Package

on:
  workflow_dispatch:
  push:
    paths:
      - "MEDORA-START-WINDOWS10.cmd"
      - ".github/workflows/windows-cmd-package.yml"
      - "server/**"
      - "client/**"
      - "shared/**"
      - "drizzle/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "patches/**"

permissions:
  contents: read

env:
  NODE_VERSION: "22.17.1"
  MARIADB_VERSION: "11.8.6"

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install and build
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        env:
          NODE_ENV: production

      - name: Create production runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'cmd-package'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$stage\runtime\node", "$stage\runtime\mariadb", "$stage\dist", "$stage\drizzle" | Out-Null

          Copy-Item 'MEDORA-START-WINDOWS10.cmd' $stage
          Copy-Item 'package.json' $stage
          Copy-Item 'dist\*' "$stage\dist" -Recurse -Force
          Copy-Item 'drizzle\*' "$stage\drizzle" -Recurse -Force

          $nodeZip = Join-Path $env:RUNNER_TEMP 'node.zip'
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v${env:NODE_VERSION}/node-v${env:NODE_VERSION}-win-x64.zip" -OutFile $nodeZip
          $nodeExtract = Join-Path $env:RUNNER_TEMP 'node-extract'
          Remove-Item -Recurse -Force $nodeExtract -ErrorAction SilentlyContinue
          Expand-Archive $nodeZip $nodeExtract -Force
          $nodeRoot = Get-ChildItem $nodeExtract -Directory | Select-Object -First 1
          Copy-Item "$($nodeRoot.FullName)\*" "$stage\runtime\node" -Recurse -Force

          $mariaZip = Join-Path $env:RUNNER_TEMP 'mariadb.zip'
          Invoke-WebRequest -Uri "https://downloads.mariadb.org/rest-api/mariadb/${env:MARIADB_VERSION}/mariadb-${env:MARIADB_VERSION}-winx64.zip" -OutFile $mariaZip
          $mariaExtract = Join-Path $env:RUNNER_TEMP 'mariadb-extract'
          Remove-Item -Recurse -Force $mariaExtract -ErrorAction SilentlyContinue
          Expand-Archive $mariaZip $mariaExtract -Force
          $mariaRoot = Get-ChildItem $mariaExtract -Directory | Select-Object -First 1
          Copy-Item "$($mariaRoot.FullName)\*" "$stage\runtime\mariadb" -Recurse -Force
          if (-not (Test-Path "$stage\runtime\mariadb\bin\mariadbd.exe")) { throw 'mariadbd.exe missing' }
          if (-not (Test-Path "$stage\runtime\mariadb\bin\mariadb-install-db.exe")) { throw 'mariadb-install-db.exe missing' }

          # Recreate a physical, portable production node_modules tree.
          $lock = Join-Path $stage 'pnpm-lock.yaml'
          Copy-Item 'pnpm-lock.yaml' $lock
          if (Test-Path 'patches') { Copy-Item 'patches' "$stage\patches" -Recurse -Force }
          Push-Location $stage
          pnpm install --prod --frozen-lockfile --node-linker=hoisted --ignore-scripts
          Pop-Location
          Remove-Item $lock -Force
          Remove-Item "$stage\patches" -Recurse -Force -ErrorAction SilentlyContinue

          $manifest = @{ product = 'MEDORA'; version = (Get-Content 'package.json' | ConvertFrom-Json).version; node = $env:NODE_VERSION; mariadb = $env:MARIADB_VERSION; launcher = 'MEDORA-START-WINDOWS10.cmd'; localhost = $true } | ConvertTo-Json
          Set-Content "$stage\WINDOWS10-PACKAGE.json" $manifest -Encoding UTF8
          $zip = Join-Path $env:GITHUB_WORKSPACE "MEDORA-Windows10-CMD.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Write-Host "Created $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 2)) MB)"

      - name: Package smoke-check
        shell: pwsh
        run: |
          $zip = Get-Item 'MEDORA-Windows10-CMD.zip'
          if ($zip.Length -lt 1MB) { throw 'CMD package is unexpectedly small' }
          Write-Host "Verified package: $($zip.Name)"

      - name: Upload CMD package
        uses: actions/upload-artifact@v4
        with:
          name: MEDORA-Windows10-CMD
          path: MEDORA-Windows10-CMD.zip
          if-no-files-found: error
          retention-days: 14
