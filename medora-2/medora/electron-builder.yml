appId: com.0ssam.medora
productName: MEDORA
executableName: MEDORA
artifactName: MEDORA-Windows10-${version}.${ext}
directories:
  output: release
files:
  - "**/*"
  - "!client/**"
  - "!docs/**"
  - "!tests/**"
  - "!server/**/*.ts"
  - "!shared/**/*.ts"
extraResources:
  - from: packaging/mariadb
    to: mariadb
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  signAndEditExecutable: false
  sign: null
nsis:
  artifactName: MEDORA-Windows10-Installer-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: MEDORA-Windows10-Portable-${version}.${ext}
  requestExecutionLevel: user
