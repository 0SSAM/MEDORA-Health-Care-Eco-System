packages:
  - "."

# Allow pnpm's own install script so the native pnpm.exe is linked on Windows
# (electron-builder resolves `pnpm` from node_modules/.bin when packaging).
onlyBuiltDependencies:
  - pnpm

# electron-builder's node-module collector resolves the pnpm binary from
# node_modules/.pnpm (the devDependency, which can be a different major than
# packageManager). Under corepack that version mismatch aborts with
# ERR_PNPM_BAD_PM_VERSION and breaks Windows packaging; ignore it. The Rust
# engine (pnpm v12+) reads this from pnpm-workspace.yaml.
pmOnFail: ignore

patchedDependencies:
  wouter@3.7.1: patches/wouter@3.7.1.patch

overrides:
  fast-xml-parser: ">=5.3.5"
  "tailwindcss@*>nanoid": 3.3.7
  body-parser: 1.20.6
  lodash: 4.18.0
  lodash-es: 4.18.0
  qs: 6.16.0
  nanoid: 5.1.16
  mdast-util-to-hast: 13.2.1
  uuid: 11.1.1
  "@esbuild-kit/core-utils@3.3.2>esbuild": 0.28.2
  picomatch: 4.0.4
  rollup: 4.59.0
  react-is: 19.2.1
