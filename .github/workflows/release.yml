name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Package artifact
        run: tar -czf medora-${{ github.ref_name }}.tar.gz dist server shared package.json drizzle
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: medora-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
