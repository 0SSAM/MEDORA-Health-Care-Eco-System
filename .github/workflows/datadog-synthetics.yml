# This workflow triggers Datadog Synthetic tests when Datadog credentials are available.
# If credentials are not configured, the check is skipped instead of failing the repository CI.

name: Run Datadog Synthetic tests

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check Datadog credentials
        id: datadog_credentials
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          if [ -n "$DD_API_KEY" ] && [ -n "$DD_APP_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Datadog credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Datadog credentials are not configured; skipping Synthetic tests."
          fi

      - name: Run Datadog Synthetic tests
        if: steps.datadog_credentials.outputs.configured == 'true'
        uses: DataDog/synthetics-ci-github-action@7039855343386c30068a97ca381e68ea405e8539 # v4.1.1
        with:
          api-key: ${{ secrets.DD_API_KEY }}
          app-key: ${{ secrets.DD_APP_KEY }}
          test-search-query: 'tag:e2e-tests'
