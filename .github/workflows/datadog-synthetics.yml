# This workflow triggers Datadog Synthetic tests within the Datadog organisation.
# Datadog credentials must be configured as GitHub Actions secrets.

name: Run Datadog Synthetic tests

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Datadog credentials are configured
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          if [ -z "$DD_API_KEY" ] || [ -z "$DD_APP_KEY" ]; then
            echo "Datadog secrets DD_API_KEY and/or DD_APP_KEY are not configured for this repository/environment."
            exit 1
          fi

      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@7039855343386c30068a97ca381e68ea405e8539 # v4.1.1
        with:
          api-key: ${{ secrets.DD_API_KEY }}
          app-key: ${{ secrets.DD_APP_KEY }}
          test-search-query: 'tag:e2e-tests'
