name: One-time MEDORA archive replacement

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  replace-repository:
    if: github.event.head_commit.message == 'chore: extract MEDORA archive onto main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract archive
        run: |
          rm -rf /tmp/medora-extracted
          mkdir -p /tmp/medora-extracted
          unzip -q MEDORA-redesign-repo-2026-09-16.zip -d /tmp/medora-extracted

      - name: Replace repository contents
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/medora-extracted/. .
          rm -rf /tmp/medora-extracted

      - name: Commit extracted repository to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: replace main with MEDORA archive contents"
          git push origin HEAD:main
