name: MEDORA Force Reconstruction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconstruct:
    if: ${{ github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source archive
        shell: bash
        run: |
          test -f MEDORA-redesign-repo-2026-09-16.zip
          test "$(stat -c%s MEDORA-redesign-repo-2026-09-16.zip)" = "14068895"
          test "$(git hash-object -t blob MEDORA-redesign-repo-2026-09-16.zip)" = "3a73109319215bd1dea8f2eb4d8946e98150d452"

      - name: Extract canonical MEDORA source
        shell: bash
        run: |
          rm -rf .reconstruction
          mkdir .reconstruction
          unzip -q MEDORA-redesign-repo-2026-09-16.zip -d .reconstruction
          test -f .reconstruction/package.json
          test -f .reconstruction/client/src/App.tsx
          test -f .reconstruction/server/_core/index.ts

      - name: Replace repository contents completely
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .reconstruction -exec rm -rf {} +
          cp -a .reconstruction/. .
          rm -rf .reconstruction
          git status --short

      - name: Commit reconstructed tree to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: force reconstruct MEDORA from redesign archive [medora-reconstruction]"
          git push origin HEAD:main
