name: Temporary lockfile refresh

on:
  push:
    branches: [fix/complete-hardening-2026-09-06]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Refresh lockfile
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate && pnpm install --lockfile-only
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
          else
            git add pnpm-lock.yaml
            git commit -m "chore(deps): regenerate lockfile after security upgrades"
            git push origin HEAD:fix/complete-hardening-2026-09-06
          fi
