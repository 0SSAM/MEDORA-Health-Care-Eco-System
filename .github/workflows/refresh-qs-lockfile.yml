name: Refresh qs lockfile

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile with patched qs
        run: pnpm update qs@6.16.0 --lockfile-only --no-frozen-lockfile
      - name: Verify patched qs is locked
        run: |
          grep -qE '^  qs: 6\.16\.0$' pnpm-lock.yaml
          grep -qE '^  qs@6\.16\.0:' pnpm-lock.yaml
          grep -qE 'h6fhOIaRrID2CbEY2fqs\+7t\+UXZo\+MLAnU5gRIq85uFtd' pnpm-lock.yaml
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git add pnpm-lock.yaml
          git commit -m "security: refresh lockfile for qs 6.16.0"
          git push
