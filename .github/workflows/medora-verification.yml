name: MEDORA Verification

on:
  push:
    branches: [main, ci/live-verification]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PNPM_VERSION: 10.34.5

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: medora_ci
          MARIADB_USER: ci
          MARIADB_PASSWORD: ci
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/medora_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Start isolated test server
        run: |
          NODE_ENV=development \
          PORT=4173 \
          JWT_SECRET="$(openssl rand -hex 48)" \
          AUDIT_SIGNING_KEY="$(openssl rand -hex 48)" \
          VITE_APP_ID="ci-verification" \
          VITE_APP_TITLE="ميدورا | منظومة الرعاية الصحية المتكاملة" \
          VITE_APP_LOGO="https://example.invalid/medora-ci-logo.png" \
          VITE_ANALYTICS_ENDPOINT="https://analytics.invalid" \
          VITE_ANALYTICS_WEBSITE_ID="ci-verification" \
          OAUTH_SERVER_URL="http://127.0.0.1:3999" \
          OWNER_OPEN_ID="ci-verification" \
          OWNER_NAME="MEDORA CI" \
          BUILT_IN_FORGE_API_URL="https://ci.invalid" \
          BUILT_IN_FORGE_API_KEY="ci-only-disabled" \
          setsid pnpm exec tsx server/_core/index.ts > /tmp/medora-verification-server.log 2>&1 &
          echo $! > /tmp/medora-verification-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/medora-verification-server.log
          exit 1
      - name: Unit and integration tests
        run: MEDORA_TEST_BASE_URL="http://127.0.0.1:4173" pnpm test -- --reporter=verbose
      - name: Stop isolated test server
        if: always()
        run: |
          if [[ -f /tmp/medora-verification-server.pid ]]; then
            kill -- "-$(cat /tmp/medora-verification-server.pid)" 2>/dev/null || true
          fi
          if [[ -f /tmp/medora-verification-server.log ]]; then
            tail -n 80 /tmp/medora-verification-server.log || true
          fi
      - name: Build
        run: pnpm build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medora-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
