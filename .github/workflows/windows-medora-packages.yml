name: MEDORA Windows Packages

on:
  workflow_dispatch:
  push:
    paths:
      - "medora-2/medora/**"
      - ".github/workflows/windows-medora-packages.yml"

permissions:
  contents: read

env:
  APP_DIR: medora-2/medora
  NODE_VERSION: "22.17.1"
  ELECTRON_VERSION: "44.2.0"
  ELECTRON_BUILDER_VERSION: "26.16.0"
  MARIADB_VERSION: "11.8.6"

jobs:
  exe:
    name: Installer + portable EXE
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: medora-2/medora
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build MEDORA
        shell: pwsh
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Bundle official MariaDB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path packaging/mariadb | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'mariadb.zip'
          Invoke-WebRequest -Uri "https://downloads.mariadb.org/rest-api/mariadb/${env:MARIADB_VERSION}/mariadb-${env:MARIADB_VERSION}-winx64.zip" -OutFile $zip
          $extract = Join-Path $env:RUNNER_TEMP 'mariadb-extract'
          Remove-Item -Recurse -Force $extract -ErrorAction SilentlyContinue
          Expand-Archive $zip $extract -Force
          $root = Get-ChildItem $extract -Directory | Select-Object -First 1
          Copy-Item "$($root.FullName)\*" packaging/mariadb -Recurse -Force
          if (-not (Test-Path packaging/mariadb/bin/mariadbd.exe)) { throw 'mariadbd.exe missing' }
          if (-not (Test-Path packaging/mariadb/bin/mariadb-install-db.exe)) { throw 'mariadb-install-db.exe missing' }

      - name: Build NSIS installer and standalone portable EXE
        shell: pwsh
        run: pnpm dlx electron-builder@${env:ELECTRON_BUILDER_VERSION} --win nsis portable --x64 --config electron-builder.yml --config.electronVersion=${env:ELECTRON_VERSION}

      - name: Verify both EXEs
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'MEDORA-Windows10-Installer-*.exe' | Select-Object -First 1
          $portable = Get-ChildItem release -Filter 'MEDORA-Windows10-Portable-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer EXE missing' }
          if (-not $portable) { throw 'Portable EXE missing' }
          if ($installer.Length -lt 1MB) { throw 'Installer EXE unexpectedly small' }
          if ($portable.Length -lt 1MB) { throw 'Portable EXE unexpectedly small' }
          Write-Host "Installer: $($installer.Name) - $([math]::Round($installer.Length / 1MB, 2)) MB"
          Write-Host "Portable: $($portable.Name) - $([math]::Round($portable.Length / 1MB, 2)) MB"

      - name: Upload EXEs
        uses: actions/upload-artifact@v4
        with:
          name: MEDORA-Windows10-EXE
          path: |
            medora-2/medora/release/MEDORA-Windows10-Installer-*.exe
            medora-2/medora/release/MEDORA-Windows10-Portable-*.exe
          if-no-files-found: error
          retention-days: 14

  cmd:
    name: Self-contained CMD package
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: medora-2/medora
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install and build
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        env:
          NODE_ENV: production

      - name: Stage production CMD package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'cmd-package'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$stage\runtime\node", "$stage\runtime\mariadb", "$stage\dist", "$stage\drizzle", "$stage\scripts", "$stage\electron" | Out-Null
          Copy-Item 'MEDORA-START-WINDOWS10.cmd' $stage
          Copy-Item 'package.json' $stage
          Copy-Item 'dist\*' "$stage\dist" -Recurse -Force
          Copy-Item 'drizzle\*' "$stage\drizzle" -Recurse -Force
          Copy-Item 'scripts\bootstrap-desktop.mjs' "$stage\scripts\bootstrap-desktop.mjs"
          Copy-Item 'electron\provision-admin.cjs' "$stage\electron\provision-admin.cjs"

          $nodeZip = Join-Path $env:RUNNER_TEMP 'node.zip'
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v${env:NODE_VERSION}/node-v${env:NODE_VERSION}-win-x64.zip" -OutFile $nodeZip
          $nodeExtract = Join-Path $env:RUNNER_TEMP 'node-extract'
          Remove-Item -Recurse -Force $nodeExtract -ErrorAction SilentlyContinue
          Expand-Archive $nodeZip $nodeExtract -Force
          $nodeRoot = Get-ChildItem $nodeExtract -Directory | Select-Object -First 1
          Copy-Item "$($nodeRoot.FullName)\*" "$stage\runtime\node" -Recurse -Force

          $mariaZip = Join-Path $env:RUNNER_TEMP 'mariadb.zip'
          Invoke-WebRequest -Uri "https://downloads.mariadb.org/rest-api/mariadb/${env:MARIADB_VERSION}/mariadb-${env:MARIADB_VERSION}-winx64.zip" -OutFile $mariaZip
          $mariaExtract = Join-Path $env:RUNNER_TEMP 'mariadb-extract'
          Remove-Item -Recurse -Force $mariaExtract -ErrorAction SilentlyContinue
          Expand-Archive $mariaZip $mariaExtract -Force
          $mariaRoot = Get-ChildItem $mariaExtract -Directory | Select-Object -First 1
          Copy-Item "$($mariaRoot.FullName)\*" "$stage\runtime\mariadb" -Recurse -Force
          if (-not (Test-Path "$stage\runtime\mariadb\bin\mariadbd.exe")) { throw 'mariadbd.exe missing' }
          if (-not (Test-Path "$stage\runtime\mariadb\bin\mariadb-install-db.exe")) { throw 'mariadb-install-db.exe missing' }

          Copy-Item 'pnpm-lock.yaml' "$stage\pnpm-lock.yaml"
          if (Test-Path 'patches') { Copy-Item 'patches' "$stage\patches" -Recurse -Force }
          Push-Location $stage
          pnpm install --prod --frozen-lockfile --node-linker=hoisted --ignore-scripts
          Pop-Location
          Remove-Item "$stage\pnpm-lock.yaml" -Force
          Remove-Item "$stage\patches" -Recurse -Force -ErrorAction SilentlyContinue

          $manifest = @{ product = 'MEDORA'; launcher = 'MEDORA-START-WINDOWS10.cmd'; systemManager = 'admin'; demoUser = $false; node = $env:NODE_VERSION; mariadb = $env:MARIADB_VERSION } | ConvertTo-Json
          Set-Content "$stage\WINDOWS10-PACKAGE.json" $manifest -Encoding UTF8
          Compress-Archive -Path "$stage\*" -DestinationPath "$env:GITHUB_WORKSPACE\MEDORA-Windows10-CMD.zip" -CompressionLevel Optimal -Force

      - name: Verify CMD package
        shell: pwsh
        run: |
          $zip = Get-Item "$env:GITHUB_WORKSPACE\MEDORA-Windows10-CMD.zip"
          if ($zip.Length -lt 1MB) { throw 'CMD package unexpectedly small' }
          Write-Host "CMD package: $([math]::Round($zip.Length / 1MB, 2)) MB"

      - name: Upload CMD package
        uses: actions/upload-artifact@v4
        with:
          name: MEDORA-Windows10-CMD
          path: MEDORA-Windows10-CMD.zip
          if-no-files-found: error
          retention-days: 14
